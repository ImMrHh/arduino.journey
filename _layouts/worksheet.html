<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  {% seo %}
</head>
<body class="worksheet">

  {% include nav.html %}

  {% assign title_parts = page.title | split: " — " %}
  {% assign ws_num = title_parts[0] | split: " " | last %}
  {% assign ws_title = title_parts[1] %}

  <!-- Worksheet Hero -->
  <div class="ws-hero">
    <div class="ws-hero-inner container">
      <div class="ws-hero-meta">
        <span class="ws-hero-badge">Worksheet</span>
        <span class="ws-hero-num">{{ ws_num }}</span>
      </div>
      <div class="ws-hero-text">
        <h1 class="ws-hero-title">{{ ws_title }}</h1>
        <div class="ws-hero-fields">
          <div class="ws-field-group">
            <label class="ws-field-label" for="ws-name">Name</label>
            <input class="ws-input" id="ws-name" type="text" placeholder="Your name" autocomplete="off">
          </div>
          <div class="ws-field-group">
            <label class="ws-field-label" for="ws-date">Date</label>
            <input class="ws-input ws-input--short" id="ws-date" type="text" placeholder="DD / MM / YYYY" autocomplete="off">
          </div>
          <div class="ws-field-group">
            <label class="ws-field-label" for="ws-group">Group</label>
            <input class="ws-input ws-input--short" id="ws-group" type="text" placeholder="e.g. 3A" autocomplete="off">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- PDF Button — sticky -->
  <div class="ws-pdf-bar no-print">
    <div class="container ws-pdf-bar-inner">
      <span class="ws-pdf-label">{{ page.title }}</span>
      <button class="ws-pdf-btn" onclick="window.print()">⬇ Save as PDF</button>
    </div>
  </div>

  <!-- Content -->
  <main class="ws-main site-main">
    <div class="container ws-content">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}

</body>
</html>
