<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Meaning — Who We Are</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent-green: #7cb342;
      --text-dark: #333;
      --text-light: #fafafa;
      --border-light: #e0e0e0;
      --bg-light: #fff;
      --bg-dark: #1a1a1a;
    }

    [data-theme="dark"] {
      --text-dark: #fafafa;
      --text-light: #333;
      --bg-light: #1a1a1a;
      --bg-dark: #fff;
      --border-light: #444;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-light);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .game-container {
      width: 100%;
      max-width: 600px;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--border-light);
    }

    .game-title {
      font-size: 24px;
      font-weight: 700;
      color: #000 !important;
    }

    [data-theme="dark"] .game-title {
      color: #fff !important;
    }

    .difficulty-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      background: var(--accent-green);
      color: white;
      margin-left: 10px;
    }

    .timer {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent-green);
    }

    .progress-container {
      margin-bottom: 25px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--border-light);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent-green);
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 12px;
      color: #999;
    }

    .game-content {
      display: none;
    }

    .game-content.active {
      display: block;
    }

    .word-card {
      background: var(--bg-dark);
      border: 2px solid var(--border-light);
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .word-display {
      text-align: center;
      margin-bottom: 30px;
    }

    .word-label {
      font-size: 12px;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .word-word {
      font-size: 32px;
      font-weight: 700;
      color: var(--accent-green);
    }

    .definition-question {
      font-size: 12px;
      font-weight: 600;
      color: #999;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .definition-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .definition-btn {
      padding: 14px 16px;
      border: 2px solid var(--border-light);
      background: var(--bg-light);
      color: var(--text-dark);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      font-weight: 500;
      min-height: 50px;
      display: flex;
      align-items: center;
    }

    .definition-btn:hover:not(:disabled) {
      border-color: var(--accent-green);
      background: rgba(124, 179, 66, 0.05);
    }

    .definition-btn.correct {
      border-color: #4caf50 !important;
      background: rgba(76, 175, 80, 0.2) !important;
      color: #333 !important;
    }

    .definition-btn.incorrect {
      border-color: #f44336 !important;
      background: rgba(244, 67, 54, 0.2) !important;
      color: #333 !important;
    }

    .definition-btn:disabled {
      cursor: not-allowed;
      opacity: 0.9;
    }

    .end-screen {
      display: none;
      text-align: center;
    }

    .end-screen.active {
      display: block;
    }

    .final-score {
      font-size: 48px;
      font-weight: 700;
      color: var(--accent-green);
      margin: 30px 0;
    }

    .score-message {
      font-size: 18px;
      margin-bottom: 25px;
      color: var(--text-dark);
    }

    .breakdown {
      background: var(--bg-dark);
      border: 2px solid var(--border-light);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      text-align: left;
    }

    .breakdown-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-light);
    }

    .breakdown-item:last-child {
      border-bottom: none;
    }

    .breakdown-label {
      font-weight: 600;
      color: #999;
    }

    .breakdown-value {
      font-weight: 700;
      color: var(--accent-green);
    }

    .leaderboard-preview {
      background: var(--bg-dark);
      border: 2px solid var(--border-light);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      text-align: left;
    }

    .leaderboard-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 12px;
    }

    .leaderboard-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-light);
      font-size: 13px;
    }

    .leaderboard-entry:last-child {
      border-bottom: none;
    }

    .leaderboard-rank {
      font-weight: 700;
      color: var(--accent-green);
      min-width: 20px;
    }

    .leaderboard-name {
      flex-grow: 1;
      margin-left: 10px;
    }

    .leaderboard-score {
      font-weight: 700;
      color: var(--accent-green);
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent-green);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #6fa027;
    }

    .btn-primary:disabled {
      background: #b8b8b8;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--border-light);
      color: var(--text-dark);
    }

    .btn-secondary:hover {
      background: #d0d0d0;
    }

    @media (max-width: 600px) {
      .game-title {
        font-size: 20px;
      }

      .difficulty-badge {
        display: block;
        margin-left: 0;
        margin-top: 8px;
      }

      .game-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .word-word {
        font-size: 28px;
      }

      .final-score {
        font-size: 40px;
      }

      .definition-btn {
        font-size: 12px;
        padding: 12px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="game-header">
      <div>
        <div class="game-title">
          Match Meaning
          <span class="difficulty-badge" id="difficultyBadge">Easy</span>
        </div>
      </div>
      <div class="timer" id="timer">0:00</div>
    </div>

    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text">
        <span id="currentQuestion">1</span> / <span id="totalQuestions">5</span>
      </div>
    </div>

    <div class="game-content active" id="gameContent">
      <div class="word-card">
        <div class="word-display">
          <div class="word-label">Word</div>
          <div class="word-word" id="currentWord">grow</div>
        </div>

        <div class="definition-question">What does this word mean?</div>

        <div class="definition-options" id="definitionOptions"></div>

        <div class="button-group" style="margin-top: 25px;">
          <button class="btn-primary" id="nextBtn" disabled>Next →</button>
        </div>
      </div>
    </div>

    <div class="end-screen" id="endScreen">
      <div class="score-message" id="scoreMessage"></div>
      <div class="final-score" id="finalScore">85</div>

      <div class="breakdown">
        <div class="breakdown-item">
          <span class="breakdown-label">Correct Answers</span>
          <span class="breakdown-value"><span id="correctCount">0</span>/<span id="totalCount">0</span></span>
        </div>
        <div class="breakdown-item">
          <span class="breakdown-label">Total Attempts</span>
          <span class="breakdown-value" id="attemptsCount">1</span>
        </div>
        <div class="breakdown-item">
          <span class="breakdown-label">Base Score (no penalty)</span>
          <span class="breakdown-value" id="baseScoreValue">100%</span>
        </div>
        <div class="breakdown-item">
          <span class="breakdown-label">Attempt Penalty</span>
          <span class="breakdown-value" id="penaltyValue">0%</span>
        </div>
      </div>

      <div class="leaderboard-preview" id="leaderboardPreview">
        <div class="leaderboard-title">Leaderboard (Easy)</div>
        <div id="leaderboardContent"></div>
      </div>

      <div class="button-group">
        <button class="btn-secondary" id="retryBtn">Retry</button>
        <button class="btn-primary" id="backBtn">Back to Unit 1</button>
      </div>
    </div>
  </div>

  <script src="../../../assets/js/storage.js"></script>
  <script src="../../../game-content.js"></script>
  <script>
    let gameState = {
      difficulty: 'easy',
      currentIndex: 0,
      questions: [],
      answers: [],
      attempts: 0,
      currentAttempts: 0,
      startTime: Date.now(),
      timerInterval: null,
      session: null,
      allVocab: null
    };

    function init() {
      gameState.session = Storage.session.get();
      if (!gameState.session) {
        window.location.href = '../../';
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      gameState.difficulty = urlParams.get('difficulty') || 'easy';

      const darkMode = Storage.settings.getDarkMode();
      if (darkMode) document.documentElement.setAttribute('data-theme', 'dark');

      generateQuestions();
      displayQuestion();
      startTimer();
    }

    function generateQuestions() {
      const count = GAME_CONTENT.difficulties[gameState.difficulty].vocab || 5;
      gameState.allVocab = GAME_CONTENT.vocabulary.all; // wrong options come from every word
      const selected = getRandomItems(getVocabPool(gameState.difficulty), count); // questions match the difficulty

      gameState.questions = selected;
      gameState.answers = Array(gameState.questions.length).fill({
        correct: false,
        attempts: 0
      });

      document.getElementById('totalQuestions').textContent = gameState.questions.length;
    }

    function displayQuestion() {
      if (gameState.currentIndex >= gameState.questions.length) {
        endGame();
        return;
      }

      const vocab = gameState.questions[gameState.currentIndex];
      document.getElementById('currentWord').textContent = vocab.word;
      document.getElementById('currentQuestion').textContent = gameState.currentIndex + 1;

      const progressPercent = ((gameState.currentIndex + 1) / gameState.questions.length) * 100;
      document.getElementById('progressFill').style.width = progressPercent + '%';

      const options = getDefinitionOptions(vocab, gameState.allVocab);
      const optionsContainer = document.getElementById('definitionOptions');
      optionsContainer.innerHTML = '';

      options.forEach((def) => {
        const btn = document.createElement('button');
        btn.className = 'definition-btn';
        btn.textContent = def;
        btn.onclick = () => selectDefinition(btn, def, vocab.def);
        optionsContainer.appendChild(btn);
      });

      document.getElementById('nextBtn').disabled = true;
      document.getElementById('nextBtn').textContent = 'Next →';
      gameState.currentAttempts = 0;

      document.getElementById('difficultyBadge').textContent = gameState.difficulty.charAt(0).toUpperCase() + gameState.difficulty.slice(1);
    }

    function selectDefinition(btn, selectedDef, correctDef) {
      const allButtons = document.querySelectorAll('.definition-btn');
      const isCorrect = selectedDef === correctDef;

      if (isCorrect) {
        allButtons.forEach(b => b.disabled = true);
        btn.classList.add('correct');
        gameState.answers[gameState.currentIndex].correct = true;
        gameState.answers[gameState.currentIndex].attempts = gameState.currentAttempts + 1;
        gameState.attempts += (gameState.currentAttempts + 1);
        document.getElementById('nextBtn').disabled = false;
      } else {
        btn.disabled = true;
        btn.classList.add('incorrect');
        gameState.currentAttempts++;
        
        allButtons.forEach(b => {
          if (b.textContent === correctDef) {
            b.classList.add('correct');
          }
        });
      }
    }

    function nextQuestion() {
      gameState.currentIndex++;
      displayQuestion();
    }

    function startTimer() {
      gameState.timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
        document.getElementById('timer').textContent = formatTime(elapsed);
      }, 100);
    }

    function endGame() {
      clearInterval(gameState.timerInterval);

      const correct = gameState.answers.filter(a => a.correct).length;
      const total = gameState.questions.length;
      const avgAttempts = gameState.attempts > 0 ? Math.ceil(gameState.attempts / total) : 1;

      const scoring = calculateScore(correct, total, avgAttempts);

      const totalTime = Math.floor((Date.now() - gameState.startTime) / 1000);
      Storage.scores.addScore('unit-1', 'activities', 'match-meaning', {
        name: gameState.session.name,
        group: gameState.session.group,
        difficulty: gameState.difficulty,
        score: scoring.finalScore,
        baseScore: scoring.baseScore,
        attempts: avgAttempts,
        correct: correct,
        total: total,
        time: totalTime
      });

      document.getElementById('gameContent').classList.remove('active');
      document.getElementById('endScreen').classList.add('active');
      document.getElementById('finalScore').textContent = scoring.finalScore;
      document.getElementById('scoreMessage').textContent = 
        scoring.finalScore >= 80 ? '🎉 Great job!' : 
        scoring.finalScore >= 60 ? '👍 Good effort!' : 
        '💪 Keep practicing!';

      document.getElementById('correctCount').textContent = correct;
      document.getElementById('totalCount').textContent = total;
      document.getElementById('attemptsCount').textContent = avgAttempts;
      document.getElementById('baseScoreValue').textContent = scoring.baseScore + '%';
      document.getElementById('penaltyValue').textContent = ((1 - scoring.attemptPenalty) * 100).toFixed(0) + '%';

      displayLeaderboardPreview();
    }

    function displayLeaderboardPreview() {
      const allScores = Storage.scores.getActivityScores('unit-1', 'match-meaning') || [];
      const filtered = allScores.filter(s => s.difficulty === gameState.difficulty && s.group === gameState.session.group);
      
      const grouped = {};
      filtered.forEach(s => {
        if (!grouped[s.name]) grouped[s.name] = [];
        grouped[s.name].push(s);
      });

      const ranked = Object.entries(grouped).map(([name, scores]) => ({
        name,
        best: scores.reduce((best, s) => s.score > best.score ? s : best)
      })).sort((a, b) => b.best.score - a.best.score).slice(0, 5);

      let html = '';
      ranked.forEach((entry, idx) => {
        const isCurrent = entry.name === gameState.session.name;
        html += `<div class="leaderboard-entry" style="${isCurrent ? 'background: rgba(124, 179, 66, 0.1); border-radius: 6px; padding-left: 8px; padding-right: 8px;' : ''}">
          <span class="leaderboard-rank">#${idx + 1}</span>
          <span class="leaderboard-name">${entry.name}</span>
          <span class="leaderboard-score">${entry.best.score}%</span>
        </div>`;
      });

      document.getElementById('leaderboardContent').innerHTML = html || '<p style="color: #999; font-size: 13px;">No scores yet</p>';
    }

    window.addEventListener('storage', (e) => {
      if (e.key === 'ws_settings') {
        const darkMode = Storage.settings.getDarkMode();
        if (darkMode) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      }
    });

    let lastDarkMode = Storage.settings.getDarkMode();
    setInterval(() => {
      const currentDarkMode = Storage.settings.getDarkMode();
      if (currentDarkMode !== lastDarkMode) {
        lastDarkMode = currentDarkMode;
        if (currentDarkMode) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      }
    }, 500);

    document.getElementById('nextBtn').addEventListener('click', nextQuestion);
    document.getElementById('retryBtn').addEventListener('click', () => location.reload());
    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = '../index.html';
    });

    init();
  </script>
</body>
</html>
