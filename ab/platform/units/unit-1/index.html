<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit 1: Who We Are — Learning Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent-green: #7cb342;
      --accent-purple: #5e35b1;
      --text-dark: #333;
      --text-light: #fafafa;
      --border-light: #e0e0e0;
      --bg-light: #fff;
      --bg-dark: #1a1a1a;
    }

    [data-theme="dark"] {
      --text-dark: #fafafa;
      --text-light: #333;
      --bg-light: #1a1a1a;
      --bg-dark: #fff;
      --border-light: #444;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-light);
      color: var(--text-dark);
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--border-light);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-dark);
      padding: 0;
    }

    .header-content h1 {
      font-size: 28px;
      color: var(--accent-green);
      margin-bottom: 5px;
    }

    .progress-info {
      font-size: 12px;
      color: #999;
    }

    .header-right {
      display: flex;
      gap: 10px;
    }

    button.icon-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-dark);
      padding: 8px;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-light);
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      max-width: 300px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .modal-content h2 {
      margin-bottom: 15px;
      color: var(--text-dark);
    }

    .modal-content p {
      color: #999;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .modal-btn-cancel {
      background: var(--border-light);
      color: var(--text-dark);
    }

    .modal-btn-confirm {
      background: var(--accent-green);
      color: white;
    }

    /* Content Sections */
    .section {
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
      color: var(--accent-green);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--bg-dark);
      border: 2px solid var(--border-light);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .card:hover {
      border-color: var(--accent-green);
      box-shadow: 0 4px 12px rgba(124, 179, 66, 0.1);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-light);
    }

    .card-checkmark {
      font-size: 20px;
      color: #4caf50;
      display: none;
    }

    .card-checkmark.show {
      display: block;
    }

    .card-subtitle {
      font-size: 12px;
      color: var(--text-light);
      opacity: 0.8;
      margin-bottom: 12px;
    }

    .difficulty-buttons {
      display: flex;
      gap: 8px;
    }

    .difficulty-btn {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border-light);
      background: var(--bg-light);
      color: var(--text-dark);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-transform: capitalize;
      transition: all 0.2s;
    }

    .difficulty-btn:hover {
      border-color: var(--accent-green);
      background: rgba(124, 179, 66, 0.1);
    }

    .card-score {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-light);
      opacity: 0.7;
    }

    .card-score strong {
      color: var(--accent-green);
      font-weight: 700;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-right {
        width: 100%;
        justify-content: flex-end;
      }

      .cards-grid {
        grid-template-columns: 1fr;
      }

      .header-content h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <button class="back-btn" id="backBtn">←</button>
        <div class="header-content">
          <h1>Unit 1: Quiénes Somos</h1>
          <div class="progress-info">
            <span id="progressPercent">0</span>% Complete
          </div>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="settingsBtn">⚙️</button>
        <button class="icon-btn" id="logoutBtn">🚪</button>
      </div>
    </div>

    <!-- Games Section -->
    <div class="section">
      <div class="section-title">Games</div>
      <div class="cards-grid" id="gamesGrid">
        <!-- Games will be populated by JS -->
      </div>
    </div>

    <!-- Activities Section -->
    <div class="section">
      <div class="section-title">Activities</div>
      <div class="cards-grid" id="activitiesGrid">
        <!-- Activities will be populated by JS -->
      </div>
    </div>
  </div>

  <!-- Logout Confirmation Modal -->
  <div class="modal" id="logoutModal">
    <div class="modal-content">
      <h2>Logout</h2>
      <p>Are you sure you want to leave? Your progress is saved.</p>
      <div class="modal-buttons">
        <button class="modal-btn-cancel" id="cancelLogoutBtn">Cancel</button>
        <button class="modal-btn-confirm" id="confirmLogoutBtn">Logout</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/students.js"></script>
  <script src="../../game-content.js"></script>
  <script>
    // Game & Activity Data
    const UNIT_1_ITEMS = {
      games: [
        { id: 'grammar-master', name: 'Grammar Master', subtitle: 'Present & Past Simple', icon: '📝' },
        { id: 'vocabulary-vault', name: 'Vocabulary Vault', subtitle: 'Definition Matching', icon: '🔓' },
        { id: 'spelling-blitz', name: 'Spelling Blitz', subtitle: 'Unscramble Words', icon: '⚡' }
      ],
      activities: [
        { id: 'match-meaning', name: 'Match Meaning', subtitle: 'Word + Definition', icon: '🎯' },
        { id: 'unscramble', name: 'Unscramble', subtitle: 'Rearrange Letters', icon: '🔤' },
        { id: 'wordsearch', name: 'Word Search', subtitle: 'Find Hidden Words', icon: '🔍' }
      ]
    };

    let session = null;
    let allScores = {};

    // Initialize
    function init() {
      session = Storage.session.get();
      if (!session) {
        window.location.href = '../';
        return;
      }

      // Apply dark mode
      const darkMode = Storage.settings.getDarkMode();
      if (darkMode) document.documentElement.setAttribute('data-theme', 'dark');

      // Load scores
      allScores = Storage.scores.getUnitScores('unit-1');

      // Render items
      renderGames();
      renderActivities();
      updateProgress();
    }

    function renderGames() {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      UNIT_1_ITEMS.games.forEach(game => {
        const card = createGameCard(game);
        grid.appendChild(card);
      });
    }

    function renderActivities() {
      const grid = document.getElementById('activitiesGrid');
      grid.innerHTML = '';

      UNIT_1_ITEMS.activities.forEach(activity => {
        const card = createActivityCard(activity);
        grid.appendChild(card);
      });
    }

    function createGameCard(game) {
      const card = document.createElement('div');
      card.className = 'card';

      // Get best score
      const gameScores = allScores.games ? allScores.games[game.id] || [] : [];
      const studentScores = gameScores.filter(s => s.name === session.name && s.group === session.group);
      const bestScore = studentScores.length > 0 
        ? Math.max(...studentScores.map(s => s.score))
        : null;
      const isCompleted = bestScore !== null;

      let html = `
        <div class="card-header">
          <div>
            <div class="card-title">${game.name}</div>
            <div class="card-subtitle">${game.subtitle}</div>
          </div>
          <div class="card-checkmark ${isCompleted ? 'show' : ''}">✓</div>
        </div>

        <div class="difficulty-buttons">
          <button class="difficulty-btn" onclick="playGame('${game.id}', 'easy')">Easy</button>
          <button class="difficulty-btn" onclick="playGame('${game.id}', 'medium')">Medium</button>
          <button class="difficulty-btn" onclick="playGame('${game.id}', 'challenge')">Challenge</button>
        </div>
      `;

      if (bestScore !== null) {
        html += `<div class="card-score">Best Score: <strong>${bestScore}%</strong></div>`;
      }

      card.innerHTML = html;
      return card;
    }

    function createActivityCard(activity) {
      const card = document.createElement('div');
      card.className = 'card';

      // Get best score
      const activityScores = allScores.activities ? allScores.activities[activity.id] || [] : [];
      const studentScores = activityScores.filter(s => s.name === session.name && s.group === session.group);
      const bestScore = studentScores.length > 0 
        ? Math.max(...studentScores.map(s => s.score))
        : null;
      const isCompleted = bestScore !== null;

      let html = `
        <div class="card-header">
          <div>
            <div class="card-title">${activity.name}</div>
            <div class="card-subtitle">${activity.subtitle}</div>
          </div>
          <div class="card-checkmark ${isCompleted ? 'show' : ''}">✓</div>
        </div>

        <div class="difficulty-buttons">
          <button class="difficulty-btn" onclick="playGame('${activity.id}', 'easy')">Easy</button>
          <button class="difficulty-btn" onclick="playGame('${activity.id}', 'medium')">Medium</button>
          <button class="difficulty-btn" onclick="playGame('${activity.id}', 'challenge')">Challenge</button>
        </div>
      `;

      if (bestScore !== null) {
        html += `<div class="card-score">Best Score: <strong>${bestScore}%</strong></div>`;
      }

      card.innerHTML = html;
      return card;
    }

    function playGame(gameId, difficulty) {
      // Games go to /games/ folder
      window.location.href = `games/${gameId}.html?difficulty=${difficulty}`;
    }

    function updateProgress() {
      const totalItems = UNIT_1_ITEMS.games.length + UNIT_1_ITEMS.activities.length;
      const allItems = [...UNIT_1_ITEMS.games, ...UNIT_1_ITEMS.activities];

      let completed = 0;
      allItems.forEach(item => {
        const scores = allScores.games?.[item.id] || allScores.activities?.[item.id] || [];
        if (scores.some(s => s.name === session.name && s.group === session.group)) {
          completed++;
        }
      });

      const percent = Math.round((completed / totalItems) * 100);
      document.getElementById('progressPercent').textContent = percent;
    }

    // Event listeners
    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = '../../units-selector.html';
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
      window.location.href = '../../settings.html';
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      document.getElementById('logoutModal').classList.add('active');
    });

    document.getElementById('cancelLogoutBtn').addEventListener('click', () => {
      document.getElementById('logoutModal').classList.remove('active');
    });

        document.getElementById('confirmLogoutBtn').addEventListener('click', () => {
      Storage.session.clear();
      window.location.href = '../../';
    });

    // Listen for dark mode changes (from settings page)
    window.addEventListener('storage', (e) => {
      if (e.key === 'ws_settings') {
        const darkMode = Storage.settings.getDarkMode();
        if (darkMode) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      }
    });

    // Monitor dark mode changes every 500ms (for same-tab updates)
    let lastDarkMode = Storage.settings.getDarkMode();
    setInterval(() => {
      const currentDarkMode = Storage.settings.getDarkMode();
      if (currentDarkMode !== lastDarkMode) {
        lastDarkMode = currentDarkMode;
        if (currentDarkMode) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      }
    }, 500);

    // Start
    init();
  </script>
</body>
</html>
