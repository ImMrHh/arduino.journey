<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Word Study Platform</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .landing-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--spacing-lg);
      background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%);
    }

    .logo {
      font-size: 3rem;
      margin-bottom: var(--spacing-lg);
    }

    .landing-card {
      background: var(--card);
      border-radius: var(--radius-lg);
      padding: var(--spacing-xl);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 1000px;
      text-align: center;
    }

    .landing-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: var(--spacing-sm);
    }

    .landing-subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-xl);
    }

    .groups-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-xl);
      margin-bottom: var(--spacing-lg);
    }

    .group-section {
      text-align: left;
    }

    .group-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: var(--spacing-lg);
      text-align: center;
      padding-bottom: var(--spacing-md);
      border-bottom: 3px solid var(--accent);
    }

    .students-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--spacing-md);
    }

    .student-btn {
      padding: var(--spacing-md);
      font-size: 0.95rem;
      font-weight: 600;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--primary);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-base);
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .student-btn:hover {
      border-color: var(--accent);
      background-color: rgba(124, 179, 66, 0.05);
      transform: translateY(-2px);
    }

    .student-btn:active {
      transform: scale(0.98);
    }

    .student-btn.loading {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .settings-link {
      margin-top: var(--spacing-lg);
      text-align: center;
    }

    .settings-link a {
      color: var(--text-secondary);
      font-size: 0.9rem;
      transition: color var(--transition-base);
    }

    .settings-link a:hover {
      color: var(--accent);
    }

    /* Dark mode */
    body.dark-mode .landing-container {
      background: linear-gradient(135deg, #1a1a1a 0%, #242424 100%);
    }

    body.dark-mode .landing-card {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    body.dark-mode .student-btn {
      background: #2a2a2a;
      border-color: #404040;
    }

    body.dark-mode .student-btn:hover {
      border-color: var(--accent);
      background-color: rgba(124, 179, 66, 0.1);
    }

    /* Mobile: Single column */
    @media (max-width: 767px) {
      .landing-container {
        padding: var(--spacing-md);
      }

      .landing-card {
        padding: var(--spacing-lg);
      }

      .landing-title {
        font-size: 1.6rem;
      }

      .logo {
        font-size: 2.5rem;
      }

      .groups-container {
        grid-template-columns: 1fr;
        gap: var(--spacing-lg);
      }

      .students-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .student-btn {
        font-size: 0.85rem;
        padding: var(--spacing-sm);
        min-height: 44px;
      }

      .group-title {
        font-size: 1.1rem;
      }
    }

    /* Tablet adjustments */
    @media (min-width: 768px) and (max-width: 1023px) {
      .landing-card {
        max-width: 900px;
      }

      .students-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Desktop: Full width layout */
    @media (min-width: 1024px) {
      .landing-card {
        max-width: 1000px;
      }

      .students-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="landing-container">
    <div class="landing-card">
      <div class="logo">📚</div>
      
      <h1 class="landing-title">Word Study</h1>
      <p class="landing-subtitle">Select your name to get started</p>

      <div class="groups-container" id="groupsContainer">
        <!-- Dynamically generated: Group A and Group B sections -->
      </div>

      <div class="settings-link">
        <a href="settings.html">⚙️ Settings</a>
      </div>
    </div>
  </div>

  <script src="assets/js/students.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/timer.js"></script>

  <script>
    // Check if already logged in
    window.addEventListener('load', () => {
      const session = Storage.session.get();
      if (session && session.name && session.group) {
        // Skip to units selector
        window.location.href = 'units-selector.html';
      }

      // Load dark mode setting
      const isDarkMode = Storage.settings.getDarkMode();
      if (isDarkMode) {
        document.body.classList.add('dark-mode');
      }

      // Render student buttons
      renderStudents();
    });

    function renderStudents() {
      const container = document.getElementById('groupsContainer');
      container.innerHTML = '';

      // Group A
      const groupASection = document.createElement('div');
      groupASection.className = 'group-section';
      groupASection.innerHTML = '<h2 class="group-title">Group A</h2>';
      const groupAGrid = document.createElement('div');
      groupAGrid.className = 'students-grid';
      
      STUDENTS.A.forEach(student => {
        const btn = document.createElement('button');
        btn.className = 'student-btn';
        btn.textContent = student.name;
        btn.onclick = () => selectStudent(student.name, 'A');
        groupAGrid.appendChild(btn);
      });
      
      groupASection.appendChild(groupAGrid);
      container.appendChild(groupASection);

      // Group B
      const groupBSection = document.createElement('div');
      groupBSection.className = 'group-section';
      groupBSection.innerHTML = '<h2 class="group-title">Group B</h2>';
      const groupBGrid = document.createElement('div');
      groupBGrid.className = 'students-grid';
      
      STUDENTS.B.forEach(student => {
        const btn = document.createElement('button');
        btn.className = 'student-btn';
        btn.textContent = student.name;
        btn.onclick = () => selectStudent(student.name, 'B');
        groupBGrid.appendChild(btn);
      });
      
      groupBSection.appendChild(groupBGrid);
      container.appendChild(groupBSection);
    }

    function selectStudent(name, group) {
      // Verify student exists in group
      if (!isValidStudent(name, group)) {
        console.error(`Invalid student: ${name} not in Group ${group}`);
        return;
      }

      // Save session
      Storage.session.set(name, group);

      // Navigate to units selector
      window.location.href = 'units-selector.html';
    }
  </script>
</body>
</html>
